services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gpn
      POSTGRES_PASSWORD: gpn
      POSTGRES_DB: gpn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpn -d gpn"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://gpn:gpn@db:5432/gpn?sslmode=disable
      ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
