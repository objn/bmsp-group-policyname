<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ · Policy Center</title><style>
:root{font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:#dce5ec;background:#111923;font-size:14px}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#1b2b37 0,#111923 58%)}.card{width:min(100% - 32px,410px);padding:34px;background:#192330;border:1px solid #2a3949;border-radius:16px;box-shadow:0 25px 80px #050a1090}.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700;margin-bottom:28px}.mark{width:38px;height:38px;border-radius:11px;background:#263b37;color:#8db6a1;display:grid;place-items:center}h1{font-size:23px;margin:0 0 7px}p{color:#93a4b4;margin:0 0 23px;line-height:1.6}.field{margin-bottom:16px}.password-wrap{display:block}.password-wrap input{padding-right:13px}.show-password{display:block;position:static;transform:none;margin:7px 0 0 auto;border:0;background:transparent;color:#8db6a1;font:600 12px "Segoe UI",sans-serif;cursor:pointer;padding:3px 0}label{display:block;margin-bottom:7px;color:#b9c7d2;font-size:13px}input{width:100%;padding:12px 13px;border:1px solid #344555;border-radius:8px;background:#202c3a;color:#e7edf1;font:14px "Segoe UI",sans-serif;outline:none}input:focus{border-color:#86b09a;box-shadow:0 0 0 3px #86b09a22}.btn{width:100%;margin-top:5px;padding:12px;border:0;border-radius:8px;background:#315447;color:#e0eee6;font:700 14px "Segoe UI",sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.1)}.error{display:none;margin-bottom:14px;padding:10px 12px;border:1px solid #66434a;border-radius:8px;background:#39262c;color:#e6a0a2;font-size:13px}.foot{margin-top:19px;color:#788b99;text-align:center;font-size:11px}
</style></head><body><main class="card"><div class="brand"><span class="mark">P</span><span>Policy Center</span></div><h1>เข้าสู่ระบบ</h1><p>ลงชื่อเข้าใช้เพื่อจัดการรายการ Policy</p><div id="error" class="error" role="alert"></div><form id="login"><div class="field"><label for="username">ชื่อผู้ใช้</label><input id="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">รหัสผ่าน</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="toggle-password" class="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></div><button class="btn" type="submit">เข้าสู่ระบบ</button></form><div class="foot">Policy Center · Secure access</div></main><script>
const form=document.getElementById('login'),error=document.getElementById('error'),password=document.getElementById('password'),toggle=document.getElementById('toggle-password');toggle.addEventListener('click',()=>{const visible=password.type==='text';password.type=visible?'password':'text';toggle.textContent=visible?'Show':'Hide';toggle.setAttribute('aria-pressed',String(!visible));toggle.setAttribute('aria-label',visible?'Show password':'Hide password')});form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';const button=form.querySelector('button[type=submit]');button.disabled=true;button.textContent='กำลังตรวจสอบ…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'เข้าสู่ระบบไม่สำเร็จ');location.replace('/')}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='เข้าสู่ระบบ'}})
</script></body></html>
