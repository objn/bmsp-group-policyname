root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/webservice.exe ."
  bin = "./tmp/webservice.exe"
  delay = 500
  exclude_dir = [".cache", ".git", "tmp", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "css", "js", "sql", "toml"]
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
